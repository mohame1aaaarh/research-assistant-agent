[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000  # 15 days
cache = false
persist_user_env = false
mask_user_env = false

# ⚠️ في الديفلوبمنت سيبه *
allow_origins = ["*"]

# =========================
# FEATURES
# =========================
[features]
unsafe_allow_html = false
latex = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = true
allow_thread_sharing = false
favorites = true

# =========================
# FILE UPLOAD (PDF)
# =========================
[features.spontaneous_file_upload]
enabled = true
accept = ["application/pdf"]
max_files = 3
max_size_mb = 10

# =========================
# AUDIO (OFF)
# =========================
[features.audio]
enabled = false
sample_rate = 24000

# =========================
# MCP (OFF)
# =========================
[features.mcp]
enabled = false

[features.mcp.sse]
enabled = true

[features.mcp.streamable-http]
enabled = true

[features.mcp.stdio]
enabled = true
allowed_executables = ["npx", "uvx"]

# =========================
# UI
# =========================
[UI]

# 🪪 Branding
name = "🔬 Logic Lords Research Assistant"
description = "AI-powered academic research assistant for search, analysis, and citations"

# 🎨 Layout
default_theme = "light"
layout = "wide"
default_sidebar_state = "open"

# 🧠 Behavior
cot = "tool_call"
confirm_new_chat = true

# 👁️ UI Options
hide_chainlit_badge = true
show_readme = true

# 🌍 Language (اختياري)
language = "en-US"
favicon = "/public/favicon.png"
# 🖼️ Assets
logo_file_url = "/public/logo.png"
default_avatar_file_url = "/public/logo.png"

# 🎨 Custom CSS
#custom_css = "/public/style.css"

# =========================
# META
# =========================
[meta]
generated_by = "custom-research-ui-v1"